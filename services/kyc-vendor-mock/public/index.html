<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demo KYC provider</title>
<style>
  :root { --bg: #f6f7f9; --card: #fff; --ink: #1b1f24; --muted: #5b6573; --accent: #2457d6; --warn: #8a5a00; }
  @media (prefers-color-scheme: dark) { :root { --bg: #111418; --card: #1b2027; --ink: #e8ecf1; --muted: #9aa5b4; --accent: #7aa2ff; --warn: #f0c060; } }
  body { margin: 0; font: 16px/1.5 system-ui, sans-serif; background: var(--bg); color: var(--ink); }
  main { max-width: 520px; margin: 0 auto; padding: 16px; }
  .banner { background: var(--warn); color: #fff; padding: 8px 12px; border-radius: 8px; font-weight: 600; }
  section { background: var(--card); border-radius: 12px; padding: 16px; margin: 16px 0; }
  label { display: block; margin: 8px 0 4px; color: var(--muted); font-size: 14px; }
  input { width: 100%; box-sizing: border-box; padding: 10px; border: 1px solid #ccd3dc; border-radius: 8px; font: inherit; }
  button { margin-top: 12px; padding: 12px 16px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; font: inherit; width: 100%; }
  button:disabled { opacity: .5; }
  video, canvas { width: 100%; border-radius: 8px; background: #000; }
  .prompt { font-size: 20px; text-align: center; margin: 8px 0; min-height: 30px; }
  .hidden { display: none; }
</style>
</head>
<body>
<main>
  <p class="banner">Demo KYC provider: a hackathon imitation. Use invented data only.</p>
  <section id="doc">
    <h2>1. Identity document</h2>
    <label for="idImage">Photo of the ID document (any image)</label>
    <input id="idImage" type="file" accept="image/png,image/jpeg,image/webp" capture="environment" required>
    <label for="fullName">Full name (as in the MRZ)</label><input id="fullName" autocomplete="off" required minlength="2">
    <label for="birthdate">Date of birth</label><input id="birthdate" type="date" required>
    <label for="nationality">Nationality (2 letters)</label><input id="nationality" maxlength="2" value="HK" required pattern="[A-Za-z]{2}">
    <label for="documentNumber">Document number</label><input id="documentNumber" autocomplete="off" required minlength="3">
    <button id="toSelfie">Continue</button>
  </section>
  <section id="selfieStep" class="hidden">
    <h2>2. Selfie and liveness</h2>
    <video id="video" autoplay playsinline muted></video>
    <p class="prompt" id="prompt">Look at the camera</p>
    <button id="start">Start the check</button>
  </section>
  <section id="done" class="hidden"><h2 id="result">Sending...</h2></section>
</main>
<script>
const $ = (id) => document.getElementById(id);
const session = new URLSearchParams(location.search).get('session') || '';
const state = { idImage: '', selfie: '', frames: [], steps: [] };
const fileToDataUrl = (f) => new Promise((ok, ko) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = ko; r.readAsDataURL(f); });
const snap = () => { const v = $('video'); const c = document.createElement('canvas'); c.width = v.videoWidth || 320; c.height = v.videoHeight || 240; c.getContext('2d').drawImage(v, 0, 0, c.width, c.height); return c.toDataURL('image/jpeg', 0.7); };
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
$('toSelfie').onclick = async () => {
  const f = $('idImage').files[0];
  // The same rules as the server's, checked before the camera step rather than after it.
  const problems = [];
  if (!f) problems.push('a photo of the document');
  else if (!/^image\/(png|jpeg|webp)$/.test(f.type) || f.size > 5900000) problems.push('a photo of the document as JPEG, PNG or WebP, under 6 MB');
  if ($('fullName').value.trim().length < 2) problems.push('the full name');
  if (!$('birthdate').value) problems.push('the date of birth');
  if (!/^[A-Za-z]{2}$/.test($('nationality').value)) problems.push('the nationality (2 letters)');
  if ($('documentNumber').value.trim().length < 3) problems.push('the document number (3 characters or more)');
  if (problems.length) return alert('Please add ' + problems.join(', ') + '.');
  state.idImage = await fileToDataUrl(f);
  $('doc').classList.add('hidden'); $('selfieStep').classList.remove('hidden');
  try { $('video').srcObject = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } }); } catch { $('prompt').textContent = 'No camera: allow camera access to continue'; }
};
$('start').onclick = async () => {
  $('start').disabled = true;
  await wait(800); state.selfie = snap();
  for (const [step, text] of [['left', 'Turn your head to the left'], ['right', 'Now to the right'], ['center', 'Back to the centre']]) {
    $('prompt').textContent = text; await wait(1800); state.frames.push(snap()); state.steps.push(step);
  }
  $('selfieStep').classList.add('hidden'); $('done').classList.remove('hidden');
  const person = { fullName: $('fullName').value, birthdate: $('birthdate').value, nationality: $('nationality').value, documentNumber: $('documentNumber').value };
  const r = await fetch('/kyc-mock/api/submit', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ session, person, idImage: state.idImage, selfie: state.selfie, liveness: { steps: state.steps, frames: state.frames } }) });
  const out = await r.json().catch(() => ({}));
  if (r.ok) { $('result').textContent = 'Check complete. Returning to Praetor...'; setTimeout(() => { location.href = out.next; }, 1200); }
  else $('result').textContent = 'The check could not be completed: ' + (out.error || r.status);
};
</script>
</body>
</html>
