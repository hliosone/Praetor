# gitleaks config (I10): the default rules, plus one path allowlist.
[extend]
useDefault = true

[[allowlists]]
description = "Golden vectors: public hashes, public test addresses and signatures from the public anvil test keys"
paths = ['''^packages/protocol/vectors/[a-z0-9-]+\.json$''']

[[allowlists]]
description = "Deployment files: public contract and member addresses written by the deploy script"
paths = ['''^infra/deployments/[a-z0-9-]+\.json$''']

[[allowlists]]
description = "Values that are exactly one 20-byte address (field names like agentKeyValidator); private keys are 32 bytes and never match"
regexTarget = "secret"
regexes = ['''^0x[0-9a-fA-F]{40}$''']

[[allowlists]]
description = "Mini program string keys (a field named key holding e.g. 'tier.T0_NEVER'): a word, a dot and an upper-case identifier is never a credential"
regexTarget = "secret"
regexes = ['''^(tier|status|reason)\.[A-Z0-9_]+$''']

[[allowlists]]
description = "EVM stub golden vectors: a test key derived from a public label (keccak256 of 'praetor-wecross-evm-stub-test'), never funded"
paths = ['''^wecross/evm-stub/src/test/resources/vectors\.json$''']
