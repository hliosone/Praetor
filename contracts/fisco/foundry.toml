# FISCO BCOS 3.17.1 contracts (spec 04): solc 0.8.28, paris (no PUSH0), same PraetorTypes as Base.
[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
cache_path = "cache"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "paris"
optimizer = true
optimizer_runs = 200
# The bytecode is embedded in packages/fisco-client: no metadata hash, so it does not depend on the checkout path.
bytecode_hash = "none"
cbor_metadata = false
fs_permissions = [{ access = "read", path = "../../packages/protocol/vectors" }]
remappings = [
  "forge-std/=lib/forge-std/src/",
  "openzeppelin-contracts/=lib/webauthn-sol/lib/openzeppelin-contracts/",
  "@praetor/protocol/=../../packages/protocol/sol/",
]

[fuzz]
runs = 10000

[profile.quick.fuzz]
runs = 256

# Guomi profile build (spec 04, M15): the same sources with the opaque-signature board, assembled by
# sm/assemble.sh into sm/build (the tree the SM smoke compiles with FISCO's SM solc). Tested here on the plain EVM.
[profile.sm]
src = "sm/build/src"
test = "sm/test"
# Own artifacts: out/ feeds packages/fisco-client (pnpm abis) and must only ever hold the main profile's build.
out = "sm/build/out"
cache_path = "sm/build/cache"
remappings = [
  "forge-std/=lib/forge-std/src/",
  "openzeppelin-contracts/=lib/webauthn-sol/lib/openzeppelin-contracts/",
  "@praetor/protocol/=sm/build/protocol/",
]

[profile.sm.fuzz]
runs = 256

[lint]
lint_on_build = false
