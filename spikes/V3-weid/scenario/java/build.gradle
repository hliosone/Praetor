// Minimal harness for the WeIdentity steps the REST service does not expose.
// Built with the Gradle 6.8 wrapper distribution + Temurin 11 already in $WEID_HOME (default ~/weid).
apply plugin: 'java'
apply plugin: 'application'

sourceCompatibility = 1.8
targetCompatibility = 1.8
mainClassName = 'spike.Scenario'

repositories { mavenCentral() }

dependencies {
    // exact version used by WeIdentity-Rest-Service 1.7.0 in this spike
    implementation 'com.webank:weid-java-sdk:3.1.1-rc.2'
    implementation 'org.apache.logging.log4j:log4j-slf4j-impl:2.20.0'
    implementation 'org.apache.logging.log4j:log4j-core:2.20.0'
}

configurations.all {
    exclude group: 'org.springframework.boot', module: 'spring-boot-starter-logging'
    exclude group: 'ch.qos.logback'
}
