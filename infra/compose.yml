# Praetor stack. Same file locally and in prod (spec 11); compose.prod.yml adds the prod overrides.
# Profiles: core, chain, wecross, agent, tee-sim, mocks, dev. `make up` starts the profiles of the current env.
# Only caddy publishes ports; anvil also listens on loopback 18545 for Foundry tests.
name: praetor

# Built once by `make fisco-image` (only when missing): a per-service build here gave each node a different recorded
# image digest, so every `make up` recreated the whole chain and broke the SDK clients' connections.
x-fisco: &fisco
  image: praetor/fisco-bcos:3.17.1
  pull_policy: never
  profiles: [chain]
  restart: unless-stopped
  healthcheck:
    interval: 5s
    timeout: 5s
    retries: 60
    start_period: 20s
    test: ['CMD-SHELL', "curl -sf -H 'content-type: application/json' --data '{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"eth_blockNumber\",\"params\":[]}' http://127.0.0.1:8545 | grep -q result"]

x-health: &health
  interval: 5s
  timeout: 5s
  retries: 30
  start_period: 10s

networks:
  praetor:
    ipam:
      config:
        - subnet: 10.88.0.0/16
  # Custodial WeIdentity services (no auth, every hosted key): only bank, MySQL and FISCO node0 join them.
  identity:
    ipam:
      config:
        - subnet: 10.89.0.0/24
  # The agent (OpenCode) reaches only mcp (and the fake LLM in tests); egress stays open for the model endpoint.
  agent:
    ipam:
      config:
        - subnet: 10.90.0.0/24

volumes:
  mysql-data:
  caddy-data:
  caddy-config:
  weid-out:
  weid-keys:
  weid-src:
  weid-gradle:
  dstack-sock:
  agent-data:

services:
  caddy:
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    profiles: [core]
    ports: ['80:80', '443:443']
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      praetor:
        ipv4_address: 10.88.0.2
    healthcheck:
      <<: *health
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:2019/config/']

  mysql:
    image: mysql:8.4.6@sha256:869218921e61d6c3c89820955d63cca42971f0e3e6c1e2792247bbd944ebc6e9
    profiles: [core, chain]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_PASSWORD_API: ${MYSQL_PASSWORD_API}
      MYSQL_PASSWORD_MCP: ${MYSQL_PASSWORD_MCP}
      MYSQL_PASSWORD_BANK: ${MYSQL_PASSWORD_BANK}
      MYSQL_PASSWORD_REGULATOR: ${MYSQL_PASSWORD_REGULATOR}
      MYSQL_PASSWORD_OPERATOR: ${MYSQL_PASSWORD_OPERATOR}
      MYSQL_PASSWORD_PAYOUT: ${MYSQL_PASSWORD_PAYOUT}
      MYSQL_PASSWORD_WEID: ${MYSQL_PASSWORD_WEID}
      MYSQL_PASSWORD_WEBASE: ${MYSQL_PASSWORD_WEBASE}
      MYSQL_PASSWORD_WECROSS: ${MYSQL_PASSWORD_WECROSS}
      MYSQL_PASSWORD_BUNDLER: ${MYSQL_PASSWORD_BUNDLER}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    networks:
      praetor:
        ipv4_address: 10.88.0.3
      identity:
        ipv4_address: 10.89.0.3
    healthcheck:
      <<: *health
      # MYSQL_PWD keeps the root password off the command line (visible in `ps`).
      test: ['CMD-SHELL', 'MYSQL_PWD="$$MYSQL_ROOT_PASSWORD" mysql -uroot -h127.0.0.1 -e "SELECT 1 FROM mysql.user LIMIT 1" >/dev/null']

  bundler:
    build:
      context: ..
      dockerfile: infra/node-service.Dockerfile
      args:
        SERVICE: bundler
    image: praetor/bundler:local
    profiles: [core]
    environment:
      PRAETOR_ENV: ${PRAETOR_ENV}
      CHAIN_MODE: ${CHAIN_MODE}
      BASE_RPC_URL: ${BASE_RPC_URL}
      DEPLOYMENTS_FILE: /app/${DEPLOYMENTS_FILE}
      MYSQL_HOST: mysql
      MYSQL_PASSWORD_BUNDLER: ${MYSQL_PASSWORD_BUNDLER}
      INTERNAL_TOKEN_BUNDLER: ${INTERNAL_TOKEN_BUNDLER}
      BUNDLER_KEY: ${BUNDLER_KEY}
      PAYMASTER_SIGNER_KEY: ${PAYMASTER_SIGNER_KEY}
    volumes:
      - ./deployments:/app/infra/deployments:ro
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      praetor:
        ipv4_address: 10.88.0.10
    healthcheck:
      <<: *health
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3010/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]

  bank:
    build:
      context: ..
      dockerfile: infra/node-service.Dockerfile
      args:
        SERVICE: bank
    image: praetor/bank:local
    profiles: [chain]
    environment:
      PRAETOR_ENV: ${PRAETOR_ENV}
      CHAIN_MODE: ${CHAIN_MODE}
      BASE_RPC_URL: ${BASE_RPC_URL}
      FISCO_RPC_URL: ${FISCO_RPC_URL}
      DEPLOYMENTS_FILE: /app/${DEPLOYMENTS_FILE}
      FISCO_DEPLOYMENTS_FILE: /app/${FISCO_DEPLOYMENTS_FILE}
      MYSQL_HOST: mysql
      MYSQL_PASSWORD_BANK: ${MYSQL_PASSWORD_BANK}
      INTERNAL_TOKEN_MEMBERS: ${INTERNAL_TOKEN_MEMBERS}
      STAFF_ENROL_TOKEN_BANK: ${STAFF_ENROL_TOKEN_BANK}
      PUBLIC_HOST: ${PUBLIC_HOST}
      PUBLIC_URL: ${PUBLIC_URL}
      BANK_FISCO_KEY: ${BANK_FISCO_KEY}
      BANK_BASE_SIGNER_KEY: ${BANK_BASE_SIGNER_KEY}
      DESK_OPERATOR_KEY: ${DESK_OPERATOR_KEY}
      KYA_ALLOW_UNATTESTED: ${KYA_ALLOW_UNATTESTED}
      ATTESTATION_MODE: ${ATTESTATION_MODE}
      ALLOWED_COMPOSE_HASHES_AGENT: ${ALLOWED_COMPOSE_HASHES_AGENT}
      ALLOWED_COMPOSE_HASHES_ATTESTER: ${ALLOWED_COMPOSE_HASHES_ATTESTER}
      KYC_ENC_KEY: ${KYC_ENC_KEY}
      KYC_VENDOR_HMAC: ${KYC_VENDOR_HMAC}
      WEID_REST_URL: http://weid-rest:6001/weid/api/invoke
      WEID_HELPER_URL: http://weid-helper:6100
      EUDI_VERIFIER_BACKEND: ${EUDI_VERIFIER_BACKEND}
      EUDI_INTENDED_USE_ID: ${EUDI_INTENDED_USE_ID}
    volumes:
      - ./deployments:/app/infra/deployments:ro
    depends_on:
      mysql:
        condition: service_healthy
      fisco-node0:
        condition: service_healthy
    networks:
      praetor:
        ipv4_address: 10.88.0.21
      identity:
        ipv4_address: 10.89.0.21
    healthcheck:
      <<: *health
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3020/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]

  regulator:
    build:
      context: ..
      dockerfile: infra/node-service.Dockerfile
      args:
        SERVICE: regulator
    image: praetor/regulator:local
    profiles: [chain]
    environment:
      PRAETOR_ENV: ${PRAETOR_ENV}
      CHAIN_MODE: ${CHAIN_MODE}
      BASE_RPC_URL: ${BASE_RPC_URL}
      FISCO_RPC_URL: ${FISCO_RPC_URL}
      DEPLOYMENTS_FILE: /app/${DEPLOYMENTS_FILE}
      FISCO_DEPLOYMENTS_FILE: /app/${FISCO_DEPLOYMENTS_FILE}
      MYSQL_HOST: mysql
      MYSQL_PASSWORD_REGULATOR: ${MYSQL_PASSWORD_REGULATOR}
      INTERNAL_TOKEN_MEMBERS: ${INTERNAL_TOKEN_MEMBERS}
      STAFF_ENROL_TOKEN_REGULATOR: ${STAFF_ENROL_TOKEN_REGULATOR}
      PUBLIC_HOST: ${PUBLIC_HOST}
      PUBLIC_URL: ${PUBLIC_URL}
      REGULATOR_FISCO_KEY: ${REGULATOR_FISCO_KEY}
      REGULATOR_BASE_SIGNER_KEY: ${REGULATOR_BASE_SIGNER_KEY}
    volumes:
      - ./deployments:/app/infra/deployments:ro
    depends_on:
      mysql:
        condition: service_healthy
      fisco-node0:
        condition: service_healthy
    networks:
      praetor:
        ipv4_address: 10.88.0.22
    healthcheck:
      <<: *health
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3020/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]

  operator:
    build:
      context: ..
      dockerfile: infra/node-service.Dockerfile
      args:
        SERVICE: operator
    image: praetor/operator:local
    profiles: [chain]
    environment:
      PRAETOR_ENV: ${PRAETOR_ENV}
      CHAIN_MODE: ${CHAIN_MODE}
      BASE_RPC_URL: ${BASE_RPC_URL}
      FISCO_RPC_URL: ${FISCO_RPC_URL}
      DEPLOYMENTS_FILE: /app/${DEPLOYMENTS_FILE}
      FISCO_DEPLOYMENTS_FILE: /app/${FISCO_DEPLOYMENTS_FILE}
      MYSQL_HOST: mysql
      MYSQL_PASSWORD_OPERATOR: ${MYSQL_PASSWORD_OPERATOR}
      INTERNAL_TOKEN_MEMBERS: ${INTERNAL_TOKEN_MEMBERS}
      STAFF_ENROL_TOKEN_OPERATOR: ${STAFF_ENROL_TOKEN_OPERATOR}
      PUBLIC_HOST: ${PUBLIC_HOST}
      PUBLIC_URL: ${PUBLIC_URL}
      OPERATOR_FISCO_KEY: ${OPERATOR_FISCO_KEY}
      OPERATOR_BASE_SIGNER_KEY: ${OPERATOR_BASE_SIGNER_KEY}
      HEARTBEAT_INTERVAL_S: ${HEARTBEAT_INTERVAL_S}
      HEARTBEAT_TTL_S: ${HEARTBEAT_TTL_S}
    volumes:
      - ./deployments:/app/infra/deployments:ro
    depends_on:
      mysql:
        condition: service_healthy
      fisco-node0:
        condition: service_healthy
    networks:
      praetor:
        ipv4_address: 10.88.0.23
    healthcheck:
      <<: *health
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3020/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]

  bridge-relayer:
    build:
      context: ..
      dockerfile: infra/node-service.Dockerfile
      args:
        SERVICE: bridge-relayer
    image: praetor/bridge-relayer:local
    profiles: [chain]
    environment:
      PRAETOR_ENV: ${PRAETOR_ENV}
      CHAIN_MODE: ${CHAIN_MODE}
      BASE_RPC_URL: ${BASE_RPC_URL}
      FISCO_RPC_URL: ${FISCO_RPC_URL}
      DEPLOYMENTS_FILE: /app/${DEPLOYMENTS_FILE}
      FISCO_DEPLOYMENTS_FILE: /app/${FISCO_DEPLOYMENTS_FILE}
      BUNDLER_URL: http://bundler:3010
      INTERNAL_TOKEN_BUNDLER: ${INTERNAL_TOKEN_BUNDLER}
      BRIDGE: ${BRIDGE}
      BRIDGE_WATCHDOG_S: ${BRIDGE_WATCHDOG_S}
      RELAYER_FISCO_KEY: ${RELAYER_FISCO_KEY}
    volumes:
      - ./deployments:/app/infra/deployments:ro
    depends_on:
      bundler:
        condition: service_healthy
      fisco-node0:
        condition: service_healthy
    networks:
      praetor:
        ipv4_address: 10.88.0.24
    healthcheck:
      <<: *health
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3030/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]

  # Four PBFT sealers (bank, regulator, operator, operator-2); web3 RPC only on the Docker network (spec 04).
  kyc-vendor-mock:
    build:
      context: ..
      dockerfile: infra/node-service.Dockerfile
      args:
        SERVICE: kyc-vendor-mock
    image: praetor/kyc-vendor-mock:local
    profiles: [mocks]
    restart: unless-stopped
    environment:
      BANK_URL: http://bank:3020
      KYC_VENDOR_HMAC: ${KYC_VENDOR_HMAC}
      PUBLIC_URL: ${PUBLIC_URL}
    networks:
      praetor:
        ipv4_address: 10.88.0.40
    healthcheck:
      <<: *health
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3040/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]

  oracle-feeder:
    build:
      context: ..
      dockerfile: infra/node-service.Dockerfile
      args:
        SERVICE: oracle-feeder
    image: praetor/oracle-feeder:local
    profiles: [chain]
    restart: unless-stopped
    environment:
      BASE_RPC_URL: ${BASE_RPC_URL}
      DEPLOYMENTS_FILE: /app/${DEPLOYMENTS_FILE}
      ORACLE_FEEDER_KEY: ${ORACLE_FEEDER_KEY}
      PYTH_API_KEY: ${PYTH_API_KEY}
      PYTH_HERMES_URL: ${PYTH_HERMES_URL}
      DEMO_HOLD_S: ${DEMO_HOLD_S}
      FEED_INTERVAL_S: 60
    volumes:
      - ./deployments:/app/infra/deployments:ro
    networks:
      praetor:
        ipv4_address: 10.88.0.70
    healthcheck:
      <<: *health
      start_period: 60s
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3070/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]

  mcp:
    build:
      context: ..
      dockerfile: infra/node-service.Dockerfile
      args:
        SERVICE: mcp
    image: praetor/mcp:local
    profiles: [agent]
    restart: unless-stopped
    environment:
      BASE_RPC_URL: ${BASE_RPC_URL}
      DEPLOYMENTS_FILE: /app/${DEPLOYMENTS_FILE}
      MYSQL_HOST: mysql
      MYSQL_PASSWORD_MCP: ${MYSQL_PASSWORD_MCP}
      INTERNAL_TOKEN_BUNDLER: ${INTERNAL_TOKEN_BUNDLER}
      SIGNER_HMAC_MCP: ${SIGNER_HMAC_MCP}
      INTERNAL_TOKEN_MCP: ${INTERNAL_TOKEN_MCP}
      INTERNAL_TOKEN_API: ${INTERNAL_TOKEN_API}
      AGENT_SUBNET: 10.90.0.0/24
      PUBLIC_URL: ${PUBLIC_URL}
      SESSION_SECRET: ${SESSION_SECRET}
    volumes:
      - ./deployments:/app/infra/deployments:ro
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      praetor:
        ipv4_address: 10.88.0.60
      agent:
        ipv4_address: 10.90.0.60
    healthcheck:
      <<: *health
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3080/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]

  agent-runner:
    build:
      context: ..
      dockerfile: services/agent-runner/Dockerfile
    image: praetor/agent-runner:local
    profiles: [agent]
    restart: unless-stopped
    environment:
      PRAETOR_ENV: ${PRAETOR_ENV}
      INTERNAL_TOKEN_AGENT: ${INTERNAL_TOKEN_AGENT}
      INTERNAL_TOKEN_MCP: ${INTERNAL_TOKEN_MCP}
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD}
      OPENCODE_API_KEY: ${OPENCODE_API_KEY}
      MCP_URL: http://mcp:3080
      AGENT_MODEL: ${AGENT_MODEL}
      AGENT_MAX_ACTIVE: ${AGENT_MAX_ACTIVE}
      FAKE_LLM_URL: ${FAKE_LLM_URL}
    volumes:
      - agent-data:/data/agents
    depends_on:
      mcp:
        condition: service_healthy
    networks:
      agent:
        ipv4_address: 10.90.0.10
    healthcheck:
      <<: *health
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3100/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]

  # Scripted model for the automated tests only (spec 05); never in prod (agent-runner refuses it there).
  fake-llm:
    build:
      context: ..
      dockerfile: infra/node-service.Dockerfile
      args:
        SERVICE: fake-llm
    image: praetor/fake-llm:local
    profiles: [agent]
    restart: unless-stopped
    networks:
      agent:
        ipv4_address: 10.90.0.20
    healthcheck:
      <<: *health
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3090/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]

  scheduler:
    build:
      context: ..
      dockerfile: infra/node-service.Dockerfile
      args:
        SERVICE: scheduler
    image: praetor/scheduler:local
    profiles: [agent]
    restart: unless-stopped
    environment:
      BASE_RPC_URL: ${BASE_RPC_URL}
      DEPLOYMENTS_FILE: /app/${DEPLOYMENTS_FILE}
      INTERNAL_TOKEN_BUNDLER: ${INTERNAL_TOKEN_BUNDLER}
      INTERNAL_TOKEN_AGENT: ${INTERNAL_TOKEN_AGENT}
      PRICE_CHECK_INTERVAL_S: ${PRICE_CHECK_INTERVAL_S}
    volumes:
      - ./deployments:/app/infra/deployments:ro
    networks:
      praetor:
        ipv4_address: 10.88.0.61
      agent:
        ipv4_address: 10.90.0.61
    healthcheck:
      <<: *health
      start_period: 60s
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3110/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]

  # TEEs locally (tee-sim profile): the dstack simulator's sockets on a shared volume, mounted where a CVM has them.
  # In prod both services run in their own Phala CVMs instead (spec 11).
  dstack-sim:
    build:
      context: ./dstack-sim
    image: praetor/dstack-sim:0.5.3
    profiles: [tee-sim]
    restart: unless-stopped
    network_mode: none
    volumes:
      - dstack-sock:/var/run/dstack
    healthcheck:
      <<: *health
      test: ['CMD', 'test', '-S', '/var/run/dstack/dstack.sock']

  agent-signer:
    build:
      context: ..
      dockerfile: infra/node-service.Dockerfile
      args:
        SERVICE: agent-signer
    image: praetor/agent-signer:local
    profiles: [tee-sim]
    restart: unless-stopped
    environment:
      PRAETOR_ENV: ${PRAETOR_ENV}
      ATTESTATION_MODE: ${ATTESTATION_MODE}
      SIGNER_HMAC_MCP: ${SIGNER_HMAC_MCP}
      SIGNER_HMAC_API: ${SIGNER_HMAC_API}
      SIGNER_HMAC_BANK: ${SIGNER_HMAC_BANK}
      PUBLIC_URL: ${PUBLIC_URL}
      DSTACK_ENDPOINT: /var/run/dstack/dstack.sock
    volumes:
      - dstack-sock:/var/run/dstack
    depends_on:
      dstack-sim:
        condition: service_healthy
    networks:
      praetor:
        ipv4_address: 10.88.0.50
    healthcheck:
      <<: *health
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3050/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]

  soter-attester:
    build:
      context: ..
      dockerfile: infra/node-service.Dockerfile
      args:
        SERVICE: soter-attester
    image: praetor/soter-attester:local
    profiles: [tee-sim]
    restart: unless-stopped
    environment:
      PRAETOR_ENV: ${PRAETOR_ENV}
      ATTESTATION_MODE: ${ATTESTATION_MODE}
      ATTESTER_HMAC_API: ${ATTESTER_HMAC_API}
      DEPLOYMENTS_FILE: /app/${DEPLOYMENTS_FILE}
      MP_APPID: ${MP_APPID}
      MP_SECRET: ${MP_SECRET}
      WECHAT_API_BASE: ${WECHAT_API_BASE}
      SOTER_FAKE_TENCENT: ${SOTER_FAKE_TENCENT}
      DSTACK_ENDPOINT: /var/run/dstack/dstack.sock
    volumes:
      - dstack-sock:/var/run/dstack
      - ./deployments:/app/infra/deployments:ro
    depends_on:
      dstack-sim:
        condition: service_healthy
    networks:
      praetor:
        ipv4_address: 10.88.0.51
    healthcheck:
      <<: *health
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3060/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]

  # WeIdentity (spec 05, V3): one-shot deployment, then the REST service (custodial keys) and our SDK helper.
  # Docker network only: neither has authentication.
  weid-deploy:
    build:
      context: ./weid
    image: praetor/weid-tools:local
    profiles: [chain]
    labels: { praetor.job: oneshot }
    environment:
      WEID_ADMIN_KEY: ${WEID_ADMIN_KEY}
      MYSQL_PASSWORD_WEID: ${MYSQL_PASSWORD_WEID}
      FISCO_CHANNEL: fisco-node0:20200
      FISCO_RPC_URL: ${FISCO_RPC_URL}
    volumes:
      - ./fisco/nodes/10.88.1.10/sdk:/fisco-sdk:ro
      - weid-out:/weid/out
      - weid-src:/weid/src
      - weid-gradle:/weid/gradle
    depends_on:
      mysql:
        condition: service_healthy
      fisco-node0:
        condition: service_healthy
    networks:
      identity:
        ipv4_address: 10.89.0.30

  weid-rest:
    build:
      context: ./weid
      dockerfile: Dockerfile.rest
    image: praetor/weid-rest:local
    profiles: [chain]
    restart: unless-stopped
    volumes:
      - weid-out:/weid/out:ro
      - weid-keys:/weid/keys
    depends_on:
      weid-deploy:
        condition: service_completed_successfully
      # The SDK keeps its node connection: restart with the node (a stale one reports "group not exist").
      fisco-node0:
        condition: service_healthy
        restart: true
    environment:
      FISCO_CHANNEL: fisco-node0:20200
    networks:
      identity:
        ipv4_address: 10.89.0.31
    healthcheck:
      <<: *health
      start_period: 60s
      test: ['CMD', 'bash', '-c', 'exec 3<>/dev/tcp/127.0.0.1/6001']

  weid-helper:
    build:
      context: ../services/identity/weid-helper
    image: praetor/weid-helper:local
    profiles: [chain]
    restart: unless-stopped
    volumes:
      - weid-out:/weid/out:ro
      - weid-keys:/weid/keys:ro
    depends_on:
      weid-rest:
        condition: service_healthy
      # The SDK keeps its node connection: restart with the node (a stale one reports "group not exist").
      fisco-node0:
        condition: service_healthy
        restart: true
    environment:
      FISCO_CHANNEL: fisco-node0:20200
    networks:
      identity:
        ipv4_address: 10.89.0.32
    healthcheck:
      <<: *health
      start_period: 60s
      # /health reads the admin WeID through the SDK: the port alone opens before the chain connection is ready.
      test: ['CMD', 'bash', '-c', 'exec 3<>/dev/tcp/127.0.0.1/6100 && printf "GET /health HTTP/1.0\r\n\r\n" >&3 && grep -q "\"ok\":true" <&3']

  # Alex's 43-step scenario, run on demand by the integration suite (never started by make up).
  weid-scenario:
    build:
      context: ../services/identity/scenario
    image: praetor/weid-scenario:local
    profiles: [tools]
    labels: { praetor.job: oneshot }
    environment:
      WEID_REST: http://weid-rest:6001/weid/api/invoke
      WEB3_RPC: ${FISCO_RPC_URL}
      FISCO_CHANNEL: fisco-node0:20200
    volumes:
      - weid-out:/weid/out:ro
      - weid-keys:/weid/keys:ro
    networks: [identity]

  fisco-node0:
    <<: *fisco
    volumes: ['./fisco/nodes/10.88.1.10/node0:/data']
    networks:
      praetor:
        ipv4_address: 10.88.1.10
      identity:
        ipv4_address: 10.89.0.10

  fisco-node1:
    <<: *fisco
    volumes: ['./fisco/nodes/10.88.1.11/node0:/data']
    networks:
      praetor:
        ipv4_address: 10.88.1.11

  fisco-node2:
    <<: *fisco
    volumes: ['./fisco/nodes/10.88.1.12/node0:/data']
    networks:
      praetor:
        ipv4_address: 10.88.1.12

  fisco-node3:
    <<: *fisco
    volumes: ['./fisco/nodes/10.88.1.13/node0:/data']
    networks:
      praetor:
        ipv4_address: 10.88.1.13

  anvil:
    image: ghcr.io/foundry-rs/foundry:v1.7.1@sha256:8347b728d5d393dac1c018691b36f506d23b9dcd78341d40ea0fcb11c3a19cdd
    profiles: [dev]
    # --network optimism enables the RIP-7212 P-256 precompile at 0x100 (Q6, V1).
    command: >-
      "anvil --host 0.0.0.0 --port 8545 --fork-url ${BASE_LIVE_RPC_URL} --fork-block-number ${FORK_BLOCK}
      --chain-id 84532 --network optimism --block-time 2 --silent"
    ports: ['127.0.0.1:18545:8545']
    networks:
      praetor:
        ipv4_address: 10.88.0.4
    healthcheck:
      <<: *health
      test: ['CMD', 'cast', 'chain-id', '--rpc-url', 'http://127.0.0.1:8545']
